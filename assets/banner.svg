<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="QUASIMOTO.DEV banner">
  <style>
    /* ===== BANNER STYLES ===== */
    svg {
      --bg-top: #0b0f2a;
      --bg-bottom: #1d0b3a;
      --grid: #8a2be2;
      --yellow: #f7b32b;
      --purple: #8a2be2;
      --green: #39ff14;
      --text: #f5f5f5;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
      --speed-cursor: 1s;
      --speed-pulse: 2.4s;
      --speed-eq: 0.9s;
      --speed-float: 3s;
      --border-color: #f7b32b;
      --border-width: 8px;
      --border-radius: 24px;
    }
    .bg-top    { stop-color: var(--bg-top); }
    .bg-bottom { stop-color: var(--bg-bottom); }
    .grid      { stroke: var(--grid); stroke-opacity: .14; stroke-width: 1; fill: none; }
    .code      { fill: var(--green); fill-opacity: .13; font: 500 18px var(--mono); }
    .title     { fill: var(--yellow); font: 800 72px var(--mono); letter-spacing: 2px; }
    .cursor    { fill: var(--purple); animation: blink var(--speed-cursor) steps(1) infinite; }
    .subtitle  { fill: var(--text); font: 500 22px var(--mono); animation: pulse var(--speed-pulse) ease-in-out infinite; }
    .comment   { fill: var(--purple); }
    
    .eq rect   { fill: var(--purple); transform-box: fill-box; transform-origin: 50% 100%; animation: eq var(--speed-eq) ease-in-out infinite alternate; }
    .eq rect:nth-child(3n)   { fill: var(--yellow); }
    .eq rect:nth-child(2)  { animation-delay: -.2s; }  .eq rect:nth-child(3)  { animation-delay: -.5s; }
    .eq rect:nth-child(4)  { animation-delay: -.1s; }  .eq rect:nth-child(5)  { animation-delay: -.7s; }
    .eq rect:nth-child(6)  { animation-delay: -.3s; }  .eq rect:nth-child(7)  { animation-delay: -.6s; }
    .eq rect:nth-child(8)  { animation-delay: -.15s; } .eq rect:nth-child(9)  { animation-delay: -.45s; }
    .eq rect:nth-child(10) { animation-delay: -.8s; }  .eq rect:nth-child(11) { animation-delay: -.25s; }
    .eq rect:nth-child(12) { animation-delay: -.55s; }

    .float { animation: float var(--speed-float) ease-in-out infinite; }
    
    /* Rounded colored border */
    .banner-border {
      fill: none;
      stroke: var(--border-color);
      stroke-width: var(--border-width);
      rx: var(--border-radius);
      ry: var(--border-radius);
      pointer-events: none;
    }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes eq    { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg-top"/>
      <stop offset="1" class="bg-bottom"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M40 0H0V40"/>
    </pattern>
    <!-- Rounded clip path so the scrolling code doesn't overflow the border -->
    <clipPath id="frame">
      <rect width="1280" height="320" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Background (clipped to rounded shape) -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    
    <!-- ANIMATION 1: Scrolling code -->
    <g class="code">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -320" dur="18s" repeatCount="indefinite"/>
      <text x="30" y="30">$ git commit -m "drop the beat"</text>
      <text x="640" y="30">fn main() { println!("boom bap"); }</text>
      <text x="30" y="70">const sample = crate.dig('dusty_vinyl');</text>
      <text x="640" y="70">import swing from 'mpc60';</text>
      <text x="30" y="110">while (true) { loop({ bpm: 92 }); }</text>
      <text x="640" y="110">sudo make beats --no-sleep</text>
      <text x="30" y="150">[ok] build passed in 0.92s</text>
      <text x="640" y="150">let snare = kit.get("snare")?;</text>
      <text x="30" y="190">git push origin main --force-with-lease</text>
      <text x="640" y="190">chmod +x ./lofi.sh &amp;&amp; ./lofi.sh</text>
      <text x="30" y="230">if (vibe &gt; 9000) deploy();</text>
      <text x="640" y="230">for bar in track: bar.chop(16)</text>
      <text x="30" y="270">#include &lt;headphones.h&gt;</text>
      <text x="640" y="270">echo "sampling..." | tee log.txt</text>
      <text x="30" y="310">return mix.master();</text>
      <text x="640" y="310">cargo run --release</text>
      <!-- block B -->
      <text x="30" y="350">$ git commit -m "drop the beat"</text>
      <text x="640" y="350">fn main() { println!("boom bap"); }</text>
      <text x="30" y="390">const sample = crate.dig('dusty_vinyl');</text>
      <text x="640" y="390">import swing from 'mpc60';</text>
      <text x="30" y="430">while (true) { loop({ bpm: 92 }); }</text>
      <text x="640" y="430">sudo make beats --no-sleep</text>
      <text x="30" y="470">[ok] build passed in 0.92s</text>
      <text x="640" y="470">let snare = kit.get("snare")?;</text>
      <text x="30" y="510">git push origin main --force-with-lease</text>
      <text x="640" y="510">chmod +x ./lofi.sh &amp;&amp; ./lofi.sh</text>
      <text x="30" y="550">if (vibe &gt; 9000) deploy();</text>
      <text x="640" y="550">for bar in track: bar.chop(16)</text>
      <text x="30" y="590">#include &lt;headphones.h&gt;</text>
      <text x="640" y="590">echo "sampling..." | tee log.txt</text>
      <text x="30" y="630">return mix.master();</text>
      <text x="640" y="630">cargo run --release</text>
    </g>
  </g>

  <!-- Left: title + subtitle + equalizer -->
  <text class="title" x="70" y="145">QUASIMOTO.DEV<tspan class="cursor">_</tspan></text>
  
  <!-- UPDATED SLOGAN -->
  <text class="subtitle" x="74" y="192"><tspan class="comment">//</tspan> Free Software, Free Society</text>

  <g class="eq">
    <rect x="74"  y="222" width="10" height="40" rx="2"/>
    <rect x="90"  y="222" width="10" height="40" rx="2"/>
    <rect x="106" y="222" width="10" height="40" rx="2"/>
    <rect x="122" y="222" width="10" height="40" rx="2"/>
    <rect x="138" y="222" width="10" height="40" rx="2"/>
    <rect x="154" y="222" width="10" height="40" rx="2"/>
    <rect x="170" y="222" width="10" height="40" rx="2"/>
    <rect x="186" y="222" width="10" height="40" rx="2"/>
    <rect x="202" y="222" width="10" height="40" rx="2"/>
    <rect x="218" y="222" width="10" height="40" rx="2"/>
    <rect x="234" y="222" width="10" height="40" rx="2"/>
    <rect x="250" y="222" width="10" height="40" rx="2"/>
  </g>

  <!-- Right: Mascot Head (Flipped, Angled Up, Floating) -->
  <g transform="translate(1200, -30) scale(-1.6, 1.6) rotate(-12)">
    <g class="float">
      <g id="layer2">
        <!-- Yellow Head Base -->
        <path
           style="fill:#ffcc00;stroke:#000000;stroke-width:1.32292;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"
           d="m 96.356588,213.33783 c -10.292139,-0.26568 -17.648984,-14.34345 -28.465264,-8.39397 -8.787437,1.73561 -19.50015,8.17489 -27.780469,3.10997 -6.125529,-8.17077 -3.608107,-19.90433 -10.994131,-27.55078 -4.03234,-7.70292 -12.570701,-14.32335 -9.158177,-23.95739 1.935901,-9.79002 6.652666,-18.88172 11.476814,-27.56023 7.202828,-6.71764 4.726182,-16.22 0.384828,-23.86502 -3.814437,-8.056772 2.291087,-15.139802 6.791543,-21.181602 3.94704,-3.96634 9.187598,-16.50571 15.630586,-10.00461 5.254894,5.82252 3.483931,14.00454 8.213808,19.61952 -0.380169,6.490312 5.038368,11.158012 10.749056,6.28631 7.086541,-2.35331 19.948326,7.625692 23.199771,-2.11094 -2.126023,-8.47686 1.858595,-15.68725 6.317177,-22.40979 8.60507,-3.49043 14.03947,10.45501 16.41365,17.05917 2.64762,8.212482 -5.76746,17.790222 2.71122,24.618742 7.58763,4.44053 9.81009,13.13486 11.74356,21.01024 1.08964,6.1895 -0.34095,15.86119 8.79632,14.66385 8.85247,4.4929 18.42161,7.43748 26.90461,12.68657 8.09188,5.35329 19.21253,-1.15016 25.98118,6.41503 8.22104,6.87599 3.60138,17.64876 1.18864,26.11325 -4.61685,8.05617 -16.03211,11.63683 -23.29844,4.51366 -9.48664,-4.86369 -20.66993,0.99133 -30.78062,-1.67489 -14.10967,-0.16433 -25.74411,9.64597 -39.53836,11.25905 -2.14101,0.54443 -4.293423,1.06992 -6.487302,1.35386 z"
           id="path2" />
        
        <!-- Nostrils -->
        <path
           style="fill:#2b0000;stroke:#000000;stroke-width:1.32292;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"
           d="m 177.1656,198.19788 -2.32232,-6.70875 5.75531,-14.9257 z"
           id="path4" />
        <path
           style="fill:#2b0000;stroke:#000000;stroke-width:1.32292;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"
           d="m 186.20243,196.79372 c 0.53851,-6.83011 1.07702,-13.66022 1.61553,-20.49033 0.8919,5.98068 1.7838,11.96136 2.6757,17.94204 -1.43041,0.84943 -2.86082,1.69886 -4.29123,2.54829 z"
           id="path5" />
        
        <!-- Right Eye (Spinning Clockwise) -->
        <g>
          <path
             id="path12"
             style="fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:1.32292;stroke-dasharray:none"
             transform="translate(8.7640449,4.494382)"
             d="m 95.505623,138.8764 c 0.709825,0.68729 -0.576251,1.29592 -1.142321,1.17978 -1.534017,-0.31473 -1.81132,-2.26864 -1.217231,-3.46442 1.062685,-2.13897 3.90709,-2.43342 5.786516,-1.25468 2.758133,1.72984 3.073533,5.56761 1.292143,8.10861 -2.374327,3.38675 -7.235959,3.7213 -10.430714,1.32959 -4.020272,-3.00972 -4.373016,-8.90801 -1.367049,-12.7528 3.640629,-4.65656 10.582171,-5.02702 15.074903,-1.40451 5.29453,4.26901 5.68246,12.25763 1.44196,17.397 -4.89582,5.93361 -13.933961,6.33886 -19.719099,1.47942 -6.57344,-5.52161 -6.995916,-15.61091 -1.516867,-22.0412 6.146664,-7.21381 17.288296,-7.65347 24.363296,-1.55432 7.85459,6.77121 8.31138,18.96602 1.59177,26.68539" />
          <animateTransform attributeName="transform" type="rotate" from="0 104.27 143.37" to="360 104.27 143.37" dur="3s" repeatCount="indefinite" />
        </g>

        <!-- Left Eye (Spinning Counter-Clockwise) -->
        <g>
          <path
             id="path12-0"
             style="fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:1.32292;stroke-dasharray:none"
             transform="translate(-34.549015,13.255015)"
             d="m 95.505623,138.8764 c 0.709825,0.68729 -0.576251,1.29592 -1.142321,1.17978 -1.534017,-0.31473 -1.81132,-2.26864 -1.217231,-3.46442 1.062685,-2.13897 3.90709,-2.43342 5.786516,-1.25468 2.758133,1.72984 3.073533,5.56761 1.292143,8.10861 -2.374327,3.38675 -7.235959,3.7213 -10.430714,1.32959 -4.020272,-3.00972 -4.373016,-8.90801 -1.367049,-12.7528 3.640629,-4.65656 10.582171,-5.02702 15.074903,-1.40451 5.29453,4.26901 5.68246,12.25763 1.44196,17.397 -4.89582,5.93361 -13.933961,6.33886 -19.719099,1.47942 -6.57344,-5.52161 -6.995916,-15.61091 -1.516867,-22.0412 6.146664,-7.21381 17.288296,-7.65347 24.363296,-1.55432 7.85459,6.77121 8.31138,18.96602 1.59177,26.68539" />
          <animateTransform attributeName="transform" type="rotate" from="360 60.96 152.13" to="0 60.96 152.13" dur="3s" repeatCount="indefinite" />
        </g>
      </g>
    </g>
  </g>

  <!-- Rounded Colored Border (drawn last so it sits on top) -->
  <rect class="banner-border" x="4" y="4" width="1272" height="312" />

</svg>
