3268;0.3321;0.3375;0.3429;0.3482;0.3536;0.3589;0.3643;0.3696;0.3750;0.3804;0.3857;0.3911;0.3964;0.4018;0.4071;0.4125;0.4179;0.4232;0.4286;0.4339;0.4393;0.4446;0.9429;1.0000" values="666.0;682.9;691.4;699.8;708.2;716.7;725.1;733.6;742.0;750.5;759.0;767.4;775.9;784.3;792.8;801.2;809.6;818.1;826.5;835.0;843.5;851.9;860.4;868.8;877.2;885.7;894.1;902.6;911.0;911.0;666.0"/></rect><rect x="666" y="191" width="560" height="24" fill="#0b0f14"><animate attributeName="x" dur="14.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4571;0.9429;1.0000" values="666.0;796.8;796.8;666.0"/></rect><rect x="666" y="215" width="560" height="24" fill="#0b0f14"><animate attributeName="x" dur="14.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5143;0.5196;0.5250;0.5304;0.5357;0.5411;0.5464;0.5518;0.5571;0.5625;0.5679;0.5732;0.5786;0.5839;0.5893;0.5946;0.6000;0.6054;0.6107;0.6161;0.6214;0.9429;1.0000" values="666.0;682.9;691.4;699.8;708.2;716.7;725.1;733.6;742.0;750.5;759.0;767.4;775.9;784.3;792.8;801.2;809.6;818.1;826.5;835.0;843.5;851.9;851.9;666.0"/></rect><rect x="666" y="239" width="560" height="24" fill="#0b0f14"><animate attributeName="x" dur="14.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6571;0.9429;1.0000" values="666.0;982.6;982.6;666.0"/></rect><text x="668" y="280" class="mono" fill="#f74c00">$</text><rect class="cursor" x="684.9" y="265" width="8" height="17" fill="#f74c00"/></g>
  </g>
</g>
</svg>